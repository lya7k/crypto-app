<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Exchange</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        h1 { text-align: center; font-size: 22px; margin-bottom: 20px; }
        
        .btn { display: block; width: 100%; padding: 16px; margin: 10px 0; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: white; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-buy { background-color: #2ecc71; }
        .btn-sell { background-color: #e74c3c; }
        .btn-match { background-color: #3498db; position: fixed; bottom: 20px; left: 20px; width: calc(100% - 40px); z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        #user-view, #admin-view { display: none; }

        .order-card { 
            background: var(--tg-theme-secondary-bg-color, #f0f0f0); 
            padding: 15px; margin-bottom: 12px; border-radius: 12px; 
            border: 2px solid transparent;
            cursor: pointer;
        }
        .order-info { margin-bottom: 4px; font-size: 14px; }
        .active-sel { border-color: #3498db; background-color: rgba(52, 152, 219, 0.1); }
        
        /* Разделитель для списка */
        .list-container { padding-bottom: 80px; } 
    </style>
</head>
<body>

    <!-- ПОЛЬЗОВАТЕЛЬСКИЙ ИНТЕРФЕЙС -->
    <div id="user-view">
        <h1>💱 Обменник P2P</h1>
        <div style="background: var(--tg-theme-secondary-bg-color, #eee); padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <p>📈 Покупка: <b><span id="rate-buy">...</span> RUB</b></p>
            <p>📉 Продажа: <b><span id="rate-sell">...</span> RUB</b></p>
        </div>
        <button class="btn btn-buy" onclick="sendAction('create_buy_order')">🟢 Купить USDT</button>
        <button class="btn btn-sell" onclick="sendAction('create_sell_order')">🔴 Продать USDT</button>
    </div>

    <!-- АДМИНСКИЙ ИНТЕРФЕЙС -->
    <div id="admin-view">
        <h1>⚙️ Пульт оператора</h1>
        <div id="orders-list" class="list-container">
            <p style="text-align:center; color:gray;">Загрузка...</p>
        </div>
        <button class="btn btn-match" onclick="matchOrders()">🔗 СВЯЗАТЬ ВЫБРАННЫЕ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        // Парсинг параметров URL
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'true';

        // Элементы
        const userView = document.getElementById('user-view');
        const adminView = document.getElementById('admin-view');

        // --- ЛОГИКА ---
        if (isAdmin) {
            // == РЕЖИМ АДМИНА ==
            adminView.style.display = 'block';
            tg.MainButton.hide(); // Скрываем стандартную кнопку, у нас своя

            const hash = window.location.hash.substring(1); // убираем #
            const params = new URLSearchParams(hash);
            const dataBase64 = params.get('data');

            if (dataBase64) {
                try {
                    // Правильная декодировка Base64 с поддержкой кириллицы (UTF-8)
                    const jsonString = decodeURIComponent(escape(window.atob(dataBase64)));
                    const orders = JSON.parse(jsonString);
                    renderOrders(orders);
                } catch (e) {
                    document.getElementById('orders-list').innerHTML = `<p style="color:red">Ошибка данных: ${e.message}</p>`;
                }
            } else {
                document.getElementById('orders-list').innerHTML = "<p style='text-align:center'>Нет активных заявок</p>";
            }

        } else {
            // == РЕЖИМ ЮЗЕРА ==
            userView.style.display = 'block';
            document.getElementById('rate-buy').innerText = urlParams.get('buy') || '-';
            document.getElementById('rate-sell').innerText = urlParams.get('sell') || '-';
        }

        // --- ФУНКЦИИ ---

        // Отправка действия (Покупка/Продажа)
        function sendAction(action) {
            const data = JSON.stringify({ action: action });
            tg.sendData(data);
        }

        // Выбор заявок (Админка)
        let selectedBuyId = null;
        let selectedSellId = null;

        function renderOrders(orders) {
            const list = document.getElementById('orders-list');
            list.innerHTML = "";

            if (orders.length === 0) {
                list.innerHTML = "<p style='text-align:center'>Список пуст</p>";
                return;
            }

            orders.forEach(order => {
                const el = document.createElement('div');
                el.className = 'order-card';
                
                // Иконки и текст
                const typeIcon = order.type === 'buy' ? '🟢 BUY' : '🔴 SELL';
                const amountText = `${order.usdt} USDT ~ ${order.rub} RUB`;
                
                el.innerHTML = `
                    <div class="order-info"><b>#${order.id}</b> | ${typeIcon}</div>
                    <div class="order-info">👤 ${order.username}</div>
                    <div class="order-info">💰 ${amountText}</div>
                `;

                // Клик по карточке
                el.onclick = () => {
                    if (order.type === 'buy') {
                        // Сброс подсветки у других BUY
                        document.querySelectorAll('.order-card').forEach(c => {
                            if(c.innerHTML.includes('🟢')) c.classList.remove('active-sel');
                        });
                        selectedBuyId = order.id;
                    } else {
                        // Сброс подсветки у других SELL
                        document.querySelectorAll('.order-card').forEach(c => {
                            if(c.innerHTML.includes('🔴')) c.classList.remove('active-sel');
                        });
                        selectedSellId = order.id;
                    }
                    el.classList.add('active-sel');
                };

                list.appendChild(el);
            });
        }

        // Кнопка "СВЯЗАТЬ"
        function matchOrders() {
            if (!selectedBuyId || !selectedSellId) {
                tg.showAlert("⚠️ Выберите одну заявку на ПОКУПКУ и одну на ПРОДАЖУ!");
                return;
            }

            // Формируем JSON для бота
            const data = JSON.stringify({
                action: 'match_orders',
                buy_order_id: selectedBuyId,
                sell_order_id: selectedSellId
            });

            // ОТПРАВЛЯЕМ БОТУ (Сработает, если кнопка Reply)
            tg.sendData(data);
        }
    </script>
</body>
</html>
