<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Exchange V3</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #222; color: #fff; padding: 20px; text-align: center; }
        input { width: 80%; padding: 10px; margin: 10px 0; font-size: 16px; border-radius: 5px; }
        button { width: 100%; padding: 15px; background: #007aff; color: white; border: none; border-radius: 10px; font-size: 18px; margin-top: 20px; }
        #debug { color: yellow; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>ВЕРСИЯ 3.0</h1>
    
    <label>Сумма RUB:</label>
    <input type="number" id="rub" value="5000">

    <button onclick="debugBuy()">КУПИТЬ (FINAL)</button>

    <div id="debug"></div>

    <script>
        // 1. Инициализация
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.ready(); // <--- САМАЯ ВАЖНАЯ КОМАНДА! Она говорит Телеграму "Я готов работать"

        function debugBuy() {
            let rub = document.getElementById('rub').value;
            let log = document.getElementById('debug');

            // Проверка: видит ли нас Телеграм?
            if (!tg.initData) {
                log.innerHTML = "ОШИБКА: Нет связи с Telegram! (initData пуст)";
                alert("Ошибка: Откройте это через кнопку в боте, а не по ссылке!");
                return;
            }

            let data = {
                action: "create_order",
                amount_rub: rub,
                amount_usdt: (rub / 98.5).toFixed(2)
            };

            try {
                log.innerHTML = "Попытка отправки...";
                tg.sendData(JSON.stringify(data));
                
                // Если sendData сработал, код ниже может не успеть выполниться (и это хорошо)
                log.innerHTML = "Данные отправлены! Окно должно закрыться.";
                
                // На всякий случай принудительно закрываем (для старых версий)
                setTimeout(function() {
                    tg.close();
                }, 500);
                
            } catch (e) {
                log.innerHTML = "ОШИБКА JS: " + e;
                alert("Ошибка: " + e);
            }
        }
    </script>
</body>
</html>
