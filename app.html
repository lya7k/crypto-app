<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Exchange</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f5f5f5; text-align: center; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; color: white; }
        .btn-buy { background-color: #2ecc71; }
        .btn-sell { background-color: #e74c3c; }
        .btn-match { background-color: #3498db; margin-top: 5px; }
        
        /* Скрываем блоки по умолчанию */
        #user-view, #admin-view { display: none; }

        .order-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; text-align: left; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .order-info { font-size: 14px; margin-bottom: 5px; }
        .active-sel { border: 2px solid #3498db; }
    </style>
</head>
<body>

    <!-- ЭКРАН ПОЛЬЗОВАТЕЛЯ -->
    <div id="user-view">
        <h1>Обмен USDT/RUB</h1>
        <p>Курс покупки: <span id="rate-buy">...</span></p>
        <p>Курс продажи: <span id="rate-sell">...</span></p>
        <button class="btn btn-buy" onclick="sendAction('create_buy_order')">🟢 Купить USDT</button>
        <button class="btn btn-sell" onclick="sendAction('create_sell_order')">🔴 Продать USDT</button>
    </div>

    <!-- ЭКРАН АДМИНА -->
    <div id="admin-view">
        <h1>Админ Панель</h1>
        <p>Выберите заявки для связки:</p>
        <div id="orders-list"></div>
        <button class="btn btn-match" onclick="matchOrders()">🔗 СВЯЗАТЬ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        // 1. Получаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'true';

        // Элементы экранов
        const userView = document.getElementById('user-view');
        const adminView = document.getElementById('admin-view');

        // Логика переключения экранов
        if (isAdmin) {
            // --- РЕЖИМ АДМИНА ---
            console.log("Admin Mode Activated");
            adminView.style.display = 'block';
            
            // Читаем данные из хеша (#data=...)
            const hash = window.location.hash.substring(1); // убираем #
            const params = new URLSearchParams(hash);
            const dataBase64 = params.get('data');

            if (dataBase64) {
                try {
                    // Распаковка Base64 -> JSON -> Массив
                    // atob декодирует base64, decodeURIComponent чинит кириллицу
                    const jsonString = decodeURIComponent(escape(window.atob(dataBase64)));
                    const orders = JSON.parse(jsonString);
                    renderOrders(orders);
                } catch (e) {
                    alert("Ошибка чтения данных: " + e.message);
                }
            } else {
                document.getElementById('orders-list').innerHTML = "<p>Нет данных</p>";
            }

        } else {
            // --- РЕЖИМ ПОЛЬЗОВАТЕЛЯ ---
            console.log("User Mode Activated");
            userView.style.display = 'block';
            
            // Показываем курсы (они передаются как ?buy=98.5&sell=95)
            document.getElementById('rate-buy').innerText = urlParams.get('buy') || '0';
            document.getElementById('rate-sell').innerText = urlParams.get('sell') || '0';
        }

        // --- ФУНКЦИИ ---

        function sendAction(action) {
            // Отправка данных для юзера (покупка/продажа)
            const data = JSON.stringify({ action: action });
            tg.sendData(data);
        }

        // Отрисовка заявок в админке
        let selectedBuyId = null;
        let selectedSellId = null;

        function renderOrders(orders) {
            const list = document.getElementById('orders-list');
            list.innerHTML = "";

            orders.forEach(order => {
                const div = document.createElement('div');
                div.className = 'order-card';
                div.innerHTML = `
                    <div class="order-info"><b>ID:</b> ${order.id} | <b>User:</b> ${order.username}</div>
                    <div class="order-info"><b>Тип:</b> ${order.type === 'buy' ? '🟢 Покупка' : '🔴 Продажа'}</div>
                    <div class="order-info"><b>Сумма:</b> ${order.usdt} USDT (${order.rub} RUB)</div>
                `;
                
                // Обработка клика (выбор заявки)
                div.onclick = () => {
                    // Снимаем выделение со старых
                    if (order.type === 'buy') {
                        document.querySelectorAll('.order-card').forEach(el => {
                            if (el.innerHTML.includes('🟢')) el.classList.remove('active-sel');
                        });
                        selectedBuyId = order.id;
                    } else {
                        document.querySelectorAll('.order-card').forEach(el => {
                            if (el.innerHTML.includes('🔴')) el.classList.remove('active-sel');
                        });
                        selectedSellId = order.id;
                    }
                    div.classList.add('active-sel'); // Добавляем рамку
                };
                list.appendChild(div);
            });
        }

        function matchOrders() {
            if (!selectedBuyId || !selectedSellId) {
                tg.showAlert("Выберите 1 покупку и 1 продажу!");
                return;
            }
            
            const data = JSON.stringify({
                action: 'match_orders',
                buy_order_id: selectedBuyId,
                sell_order_id: selectedSellId
            });
            
            // ВОТ ЗДЕСЬ ТЕПЕРЬ СРАБОТАЕТ sendData, Т.К. ЭТО НИЖНЯЯ КЛАВИАТУРА
            tg.sendData(data);
        }
    </script>
</body>
</html>
