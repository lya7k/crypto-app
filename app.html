<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Exchange</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        .btn { display: block; width: 100%; padding: 14px; margin-top: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: white; background-color: var(--tg-theme-button-color, #3498db); }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; background: var(--tg-theme-secondary-bg-color, #f5f5f5); color: var(--tg-theme-text-color, #000); }
        input:disabled { background-color: #e0e0e0; color: #555; }
        
        .tabs { display: flex; margin-bottom: 15px; background: var(--tg-theme-secondary-bg-color, #eee); border-radius: 10px; padding: 4px; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .tab.active { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab-buy.active { color: #2ecc71; }
        .tab-sell.active { color: #e74c3c; }

        #user-view, #admin-view { display: none; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: gray; }
        .order-card { background: var(--tg-theme-secondary-bg-color, #f0f0f0); padding: 12px; margin-bottom: 8px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; }
        .active-sel { border-color: #3498db; }
    </style>
</head>
<body>

    <!-- ПОЛЬЗОВАТЕЛЬ -->
    <div id="user-view">
        <div class="tabs">
            <div class="tab tab-buy active" onclick="setMode('buy')">Купить</div>
            <div class="tab tab-sell" onclick="setMode('sell')">Продать</div>
        </div>

        <label>Сумма (RUB):</label>
        <input type="number" id="inp-amount" placeholder="Введите сумму" oninput="calc()">
        
        <div class="info-row">
            <span>Курс: <b id="current-rate">...</b></span>
            <span>Итого: <b id="result-usdt">0 USDT</b></span>
        </div>
            
<div id="card-block" style="display:none;">
            <label>Банк (или СБП):</label>
            <input type="text" id="inp-bank" placeholder="Например: Сбербанк или СБП (Т-Банк)">
            <label>Номер карты / телефона:</label>
            <input type="text" id="inp-card" placeholder="0000 0000 0000 0000 / +79991234567">
        </div>

        <button class="btn" onclick="submitOrder()">Создать заявку</button>
    </div>

<!-- АДМИН -->
    <div id="admin-view">
        <h3 style="text-align:center">Пульт оператора</h3>
        
        <!-- Две колонки -->
        <div style="display: flex; gap: 10px; margin-bottom: 60px;">
            <div style="flex: 1;">
                <h4 style="text-align:center; margin: 5px 0; color: #e74c3c;">Продажа 🔴</h4>
                <div id="orders-sell" style="display: flex; flex-direction: column; gap: 8px;">Загрузка...</div>
            </div>
            <div style="flex: 1;">
                <h4 style="text-align:center; margin: 5px 0; color: #2ecc71;">Покупка 🟢</h4>
                <div id="orders-buy" style="display: flex; flex-direction: column; gap: 8px;">Загрузка...</div>
            </div>
        </div>

        <button class="btn" style="position:fixed; bottom:20px; width:calc(100% - 40px);" onclick="matchOrders()">🔗 СВЯЗАТЬ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'true';
        const buyRate = parseFloat(urlParams.get('buy')) || 0;
        const sellRate = parseFloat(urlParams.get('sell')) || 0;
        
        // Получаем лимит из URL
        const limit = parseFloat(urlParams.get('limit')) || 0;

        let currentMode = 'buy';
        let selectedBuyId = null; 
        let selectedSellId = null;

        if (isAdmin) {
            document.getElementById('admin-view').style.display = 'block';
            loadAdminData();
        } else {
            document.getElementById('user-view').style.display = 'block';
            setupUserView();
        }

        function setupUserView() {
            setMode('buy');
            
            // Если включен жесткий лимит
            const inp = document.getElementById('inp-amount');
            if (limit > 0) {
                inp.value = limit;
                inp.disabled = true; // Блокируем ввод
                calc(); // Сразу считаем
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelector('.tab-buy').classList.toggle('active', mode === 'buy');
            document.querySelector('.tab-sell').classList.toggle('active', mode === 'sell');
            document.getElementById('card-block').style.display = (mode === 'sell') ? 'block' : 'none';
            document.getElementById('current-rate').innerText = (mode === 'buy' ? buyRate : sellRate);
            calc();
        }

        function calc() {
            const inp = document.getElementById('inp-amount');
            const amountRub = parseFloat(inp.value) || 0;
            const rate = (currentMode === 'buy') ? buyRate : sellRate;
            
            if (rate > 0) {
                const resUsdt = (amountRub / rate).toFixed(2);
                document.getElementById('result-usdt').innerText = resUsdt + " USDT";
            }
        }

        function submitOrder() {
            const amount = parseFloat(document.getElementById('inp-amount').value);
            const card = document.getElementById('inp-card').value;

            if (!amount || amount <= 0) {
                tg.showAlert("Ошибка суммы!");
                return;
            }
            if (currentMode === 'sell' && card.length < 5) {
                tg.showAlert("Введите номер карты!");
                return;
            }

            const data = {
                action: 'create_order',
                type: currentMode,
                amount_rub: amount,
                bank: (currentMode === 'sell') ? document.getElementById('inp-bank').value : null,
                card: (currentMode === 'sell') ? card : null
            };
            tg.sendData(JSON.stringify(data));
        }
function loadAdminData() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const dataBase64 = params.get('data');
            
            const listBuy = document.getElementById('orders-buy');
            const listSell = document.getElementById('orders-sell');
            
            if (!dataBase64) {
                listBuy.innerHTML = "<p>Нет данных</p>";
                listSell.innerHTML = "<p>Нет данных</p>";
                return;
            }
            try {
                const jsonString = decodeURIComponent(escape(window.atob(dataBase64)));
                const orders = JSON.parse(jsonString);
                
                listBuy.innerHTML = "";
                listSell.innerHTML = "";
                
                if(orders.length === 0) {
                    listBuy.innerHTML = "<p style='text-align:center'>Пусто</p>";
                    listSell.innerHTML = "<p style='text-align:center'>Пусто</p>";
                    return;
                }

                orders.forEach(order => {
                    const el = document.createElement('div');
                    el.className = 'order-card';
                    el.innerHTML = `<b>#${order.id}</b> | ${order.username}<br>${order.rub} RUB<br><small>~${order.usdt} USDT</small>`;
                    
                    if (order.type === 'buy') {
                        el.style.borderLeft = "4px solid #2ecc71"; // Зеленая полоска
                        el.onclick = () => {
                            document.querySelectorAll('#orders-buy .order-card').forEach(c => c.classList.remove('active-sel'));
                            selectedBuyId = order.id;
                            el.classList.add('active-sel');
                        };
                        listBuy.appendChild(el);
                    } else {
                        el.style.borderLeft = "4px solid #e74c3c"; // Красная полоска
                        el.onclick = () => {
                            document.querySelectorAll('#orders-sell .order-card').forEach(c => c.classList.remove('active-sel'));
                            selectedSellId = order.id;
                            el.classList.add('active-sel');
                        };
                        listSell.appendChild(el);
                    }
                });
            } catch (e) {
                listBuy.innerHTML = "Ошибка загрузки";
            }
        }

        function matchOrders() {
            if (!selectedBuyId || !selectedSellId) {
                tg.showAlert("Выберите пару!");
                return;
            }
            tg.sendData(JSON.stringify({
                action: 'match_orders',
                buy_order_id: selectedBuyId,
                sell_order_id: selectedSellId
            }));
        }
    </script>
</body>
</html>
